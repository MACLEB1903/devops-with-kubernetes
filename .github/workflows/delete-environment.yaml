name: Automatic Environment Deletion

on:
  delete:

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: "theprojectstep17acr.azurecr.io"
  ACR_NAME: "theprojectstep17acr"
  RESOURCE_GROUP: "e3.8-the-project-step-17"
  AKS_CLUSTER: "tps17-aks"

jobs:
  check-the-branch:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest

    outputs:
      namespace: ${{ steps.branch.outputs.namespace }}

    steps:
      - name: Get deleted branch name
        id: branch
        run: |
          echo "namespace=${{ github.event.ref }}" >> "$GITHUB_OUTPUT"

  delete-the-environment:
    needs: check-the-branch
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.AKS_CLUSTER }}" \
            --overwrite-existing

      - name: Delete the namespace
        run: |
          kubectl delete namespace "${{ needs.check-the-branch.outputs.namespace }}"