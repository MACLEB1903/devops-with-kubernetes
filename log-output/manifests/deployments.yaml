apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
spec:
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      securityContext:
        fsGroup: 1000
      volumes:
        - name: shared-volume
          persistentVolumeClaim:
            claimName: log-output-pingpong-pvc

      containers:
        - name: log-generator
          image: log-generator:latest
          imagePullPolicy: IfNotPresent
          workingDir: /files
          volumeMounts:
            - name: shared-volume
              mountPath: /files

        - name: log-reader
          image: log-reader:latest
          imagePullPolicy: IfNotPresent
          workingDir: /files
          volumeMounts:
            - name: shared-volume
              mountPath: /files
          env:
            - name: PORT
              value: "4000"
          ports:
            - containerPort: 4000
