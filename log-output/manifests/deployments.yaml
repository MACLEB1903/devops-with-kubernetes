apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
spec:
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: log-output-volumes
          emptyDir: {}

      containers:
        - name: log-generator
          image: log-generator:latest
          imagePullPolicy: IfNotPresent
          workingDir: /files
          volumeMounts:
            - name: log-output-volumes
              mountPath: /files

        - name: log-reader
          image: log-reader:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "4000"
          ports:
            - containerPort: 4000
          workingDir: /files
          volumeMounts:
            - name: log-output-volumes
              mountPath: /files
