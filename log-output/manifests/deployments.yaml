apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
spec:
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      containers:
        - name: log-output
          image: log-output:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "4000"
          ports:
            - containerPort: 4000
