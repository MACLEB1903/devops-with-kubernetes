apiVersion: v1
kind: PersistentVolume
metadata:
  name: log-output-pingpong-pv
spec:
  storageClassName: shared-volume
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  local:
    path: /tmp/kube
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3d-exercise-1-11-server-0
