server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location /image {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    location /todos {
        proxy_pass http://todo-backend-svc:2345;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}