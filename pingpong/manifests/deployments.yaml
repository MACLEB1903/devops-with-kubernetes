apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingpong
spec:
  selector:
    matchLabels:
      app: pingpong
  template:
    metadata:
      labels:
        app: pingpong
    spec:
      securityContext:
        fsGroup: 1000
      volumes:
        - name: shared-volume
          persistentVolumeClaim:
            claimName: log-output-pingpong-pvc

      containers:
        - name: pingpong
          image: pingpong:latest
          imagePullPolicy: IfNotPresent
          workingDir: /files
          volumeMounts:
            - name: shared-volume
              mountPath: /files
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
