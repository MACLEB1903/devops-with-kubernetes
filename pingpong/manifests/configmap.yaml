apiVersion: v1
kind: ConfigMap
metadata:
  name: pingpong-configmap
data:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_HOST: "pingpong-db-svc"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "pingpong-database"

  init.sql: |
    CREATE TABLE IF NOT EXISTS ping (
      count INTEGER NOT NULL DEFAULT 0
    );

    INSERT INTO ping (count)
    SELECT 0
    WHERE NOT EXISTS (
      SELECT 1 FROM ping
    );
